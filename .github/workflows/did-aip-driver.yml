name: did-aip-driver

# Runs the driver's own suite, then builds, smoke-tests and publishes the did:aip v2 Universal Resolver driver to
# GHCR. Carried over from aip-beta with the same two rules that made it useful:
# the smoke test is hermetic, and :latest is never pushed.
#
# After the first successful run the package must be made PUBLIC once, by hand:
#   Packages -> driver-did-aip -> Package settings -> Change visibility
# The Universal Resolver pulls anonymously.

on:
  push:
    branches: [main]
    paths:
      - "packages/did-aip-driver/**"
      - "packages/did-resolver/**"
      - ".github/scripts/vitest-summary.mjs"
      - ".github/workflows/did-aip-driver.yml"
  # No path filter on pull_request, deliberately. A required status check that a
  # filter skips never reports, and GitHub blocks the merge waiting for a run
  # that will not happen. The push filter above still keeps main's runs narrow.
  pull_request:
  workflow_dispatch:

# Read-only at the workflow level. `packages: write` is granted only to the job
# that pushes to GHCR, so the unit job below does not run `npm ci` — which
# executes package lifecycle scripts — holding a registry write token.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/driver-did-aip

jobs:
  # The driver's own suite, which CI has never run. This workflow built an image
  # and smoke-tested the container, which exercises the HTTP surface but not
  # config parsing or envelope construction — and packages/did-aip-driver has
  # had `npm test` since it was carried over from aip-beta. square#43.
  unit:
    name: did-aip-driver (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/did-aip-driver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      # Depends on ../did-resolver by path, so the resolver's declarations have
      # to exist before this typechecks — the same ordering cli.yml needs.
      - name: Build @squaresdk/did-resolver
        working-directory: packages/did-resolver
        run: |
          npm ci
          npm run build

      # npm ci, not npm install: install rewrites this package's lockfile
      # depending on whether ../did-resolver happens to be installed yet, which
      # would leave every run with a dirty tree for no reason.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/driver.json

      - name: How many tests ran
        if: always()
        run: node ../../.github/scripts/vitest-summary.mjs /tmp/driver.json did-aip-driver

  # The version tag is written once (see the push step below), so a change to
  # what goes into the image has to come with a new version, or it would never
  # be published under a version at all. This is the check that says so on the
  # pull request rather than after the merge: if any file the Dockerfile copies
  # changed against the base branch, the driver's version must have changed
  # too. Files outside the image (tests, READMEs, this workflow) are free.
  version:
    name: did-aip-driver version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: A change to the image comes with a version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # What the Dockerfile copies into the image, resolver included.
          inputs=(
            packages/did-aip-driver/Dockerfile
            packages/did-aip-driver/package.json
            packages/did-aip-driver/tsconfig.json
            packages/did-aip-driver/tsconfig.build.json
            packages/did-aip-driver/src
            packages/did-resolver/package.json
            packages/did-resolver/package-lock.json
            packages/did-resolver/tsconfig.json
            packages/did-resolver/tsconfig.build.json
            packages/did-resolver/src
          )
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- "${inputs[@]}")"
          if [ -z "$changed" ]; then
            echo "nothing the image is built from changed; no version bump needed"
            exit 0
          fi
          version() { node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"; }
          base_version="$(git show "$BASE_SHA:packages/did-aip-driver/package.json" | version)"
          head_version="$(version < packages/did-aip-driver/package.json)"
          echo "image inputs changed:"; echo "$changed" | sed 's/^/  /'
          echo "driver version: $base_version on the base branch, $head_version here"
          if [ "$base_version" = "$head_version" ]; then
            echo "::error::the image's inputs changed but packages/did-aip-driver/package.json still says $head_version. The :$head_version tag is written once, so this build would never be published under a version; bump the version."
            exit 1
          fi
          echo "ok: $base_version -> $head_version"

  build-test-publish:
    name: did-aip-driver image
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Read driver version
        id: ver
        run: echo "version=$(node -p "require('./packages/did-aip-driver/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # The build context is packages/, not the driver directory: the driver
      # depends on ../did-resolver by path and Docker cannot reach outside its
      # context.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./packages
          file: ./packages/did-aip-driver/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}

      - name: Smoke test (hermetic — no RPC is contacted)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name aip-driver -p 8080:8080 "${IMAGE}:${VERSION}"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/health && break
            sleep 1
          done

          fail=0
          check() {  # name expected url
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/ld+json" "$3")
            if [ "$code" = "$2" ]; then echo "  ok   $1 -> $code"
            else echo "  FAIL $1 -> $code (expected $2)"; fail=1; fi
          }

          check health 200 http://localhost:8080/health
          # The check that must never regress: a malformed DID is a client error,
          # not a server error, and the driver must say so without any network.
          check invalidDid 400 "http://localhost:8080/1.0/identifiers/did:aip:invalid"
          # A v1 DID is well-formed; this driver simply does not serve it. 400 here
          # would tell the caller their identifier is broken when it is not.
          check v1 501 "http://localhost:8080/1.0/identifiers/did:aip:7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU:scribe"
          # A chain the image is not configured for.
          check unknownChain 501 "http://localhost:8080/1.0/identifiers/did:aip:eip155:1:0x8004a818bfb912233c491871b3d84c89a494bd9e:1"

          docker logs aip-driver
          docker rm -f aip-driver
          exit $fail

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versioned and sha tags only. :latest on a resolver driver means an
      # operator cannot tell which build the Universal Resolver is running.
      #
      # The version tag is written once. Every main push that matches this
      # workflow's path filter used to re-push :<version> with whatever the
      # tree held, so :0.2.1 was overwritten by builds that had nothing to do
      # with a release, and an operator pinning it would have got a different
      # image on each pull (square#123). Now a version tag that already exists
      # in the registry is left alone, and only sha-<commit> is pushed; the
      # `version` job above makes sure a change to the image's inputs cannot
      # arrive without a new version, so "left alone" only ever happens for a
      # rebuild of the same inputs.
      - name: Push versioned tags (never :latest, and a version only once)
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          short=$(echo "${GITHUB_SHA}" | cut -c1-12)
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:sha-${short}"
          docker push "${IMAGE}:sha-${short}"
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${VERSION} already exists and is left as it is; this build is ${IMAGE}:sha-${short}"
          else
            docker push "${IMAGE}:${VERSION}"
            echo "published ${IMAGE}:${VERSION}"
          fi
