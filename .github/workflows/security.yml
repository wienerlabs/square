name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action organizasyonlarda GITLEAKS_LICENSE istiyor; CLI istemiyor.
      - name: gitleaks (CLI)
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  grep:
    name: forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no private keys or production-ZK claims
        run: |
          set -euo pipefail
          fail=0
          # Private key material must never be committed.
          if grep -rInE 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' --exclude-dir=.git .; then
            echo "::error::private key material committed"; fail=1
          fi
          # The trusted setup is a demo until the public ceremony completes.
          # Bilerek yazilan feragatnameler "ci-allow-phrase" ile isaretlenir,
          # boylece istisna gorunur olur ve kural kazara susturulamaz.
          if grep -rIn --exclude-dir=.git --exclude-dir=.github -i 'production ZK' . | grep -v 'ci-allow-phrase'; then
            echo "::error::'production ZK' claim found - the setup is a demo until the ceremony lands"; fail=1
          fi
          exit $fail
