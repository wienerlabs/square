name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  grep:
    name: forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no private key material
        run: |
          set -euo pipefail
          # Private key material must never be committed.
          if grep -rInE 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' --exclude-dir=.git .; then
            echo "::error::private key material committed"
            exit 1
          fi
      # The trusted setup is a demo until the public ceremony (#16) completes.
      # Patterns live in docs/disclosure/forbidden-phrases.txt so the enforced
      # list and the documented list cannot drift apart. The script self-tests
      # against docs/disclosure/guard-fixtures/ first, so a gutted pattern list
      # fails loudly instead of passing everything.
      - name: no production-ZK claims
        run: .github/scripts/check-forbidden-phrases.sh
