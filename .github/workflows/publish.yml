name: publish

# The @squaresdk packages to npm (square#356, docs/decisions/distribution-channel.md).
#
# Every pull request packs all thirteen and installs the tarballs into an
# empty project, so a package that would ship without its dist, its bin or
# its license, or with a `file:` dependency, fails here and not on the day of
# a release. A tag `v<version>` publishes: the version has to be the one every
# package declares (they move in lockstep), and a version the registry already
# holds is skipped, so a re-run after a partial failure publishes the rest.
#
# The token is the NPM_TOKEN secret. Without it the publish job says so and
# does nothing, the way deploy.yml does without VERCEL_TOKEN.

on:
  push:
    tags: ["v*"]
  # Every pull request, unfiltered, for the reason packages.yml gives; a
  # push to main is covered by the pull request that made it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: pack and install (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Build every package in dependency order, pack it, install the tarballs into an empty project
        run: |
          set -euo pipefail
          node scripts/publish.mjs --build --install-check | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish to npm
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Skip without an npm token
        if: env.HAS_TOKEN != 'true'
        run: echo "NPM_TOKEN is not set; add it as a repository secret and a v* tag publishes the packages." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build, pack, and publish what the registry does not hold, at the tag's version
        if: env.HAS_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish.mjs --build --expect-version "${GITHUB_REF_NAME#v}" --publish | tee -a "$GITHUB_STEP_SUMMARY"
