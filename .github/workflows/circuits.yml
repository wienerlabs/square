name: circuits

# The circuit, and the one job that proves against it for real.
#
# Both live here because both need the same thing: a pinned circom and a built
# proving key. Splitting them into two workflows would install and build twice.
#
# The building is the point, not setup. Every describe() in circuits/test is
# guarded by skipIf(!isBuilt(...)), and three suites in services/prover skip
# without a proving key. Those guards are right on a laptop and wrong in CI —
# a runner with no compiler reports green having executed almost nothing. Both
# jobs therefore build first and then fail if the artifacts are not on disk,
# and both name every test that was skipped anyway on the run summary.
#
# Measured on 2026-09-07 on a clean checkout after `npm ci`, with nothing built.
# The figure in brackets is what vitest collected, not what ran:
#   circuits         4 passed | 45 skipped (49 collected), exit 0
#   prover          63 passed |  6 skipped (69 collected), exit 0
# That is an observation from that date, not a target and not a current count.
# A rerun collects whatever the suites hold on the day; the run summary the two
# jobs below write is the live number.
#
# Hermetic apart from one fetch: the phase-1 powers of tau, hash-checked against
# the adopted file by circuits/scripts/fetch-ptau.mjs, so neither the mirror nor
# the Actions cache is trusted for its contents.

on:
  push:
    branches: [main]
    paths:
      - "circuits/**"
      - "services/prover/**"
      - "contracts/src/Groth16Verifier.sol"
      - "contracts/src/ComplianceModule.sol"
      - "contracts/src/SquareHook.sol"
      - "contracts/script/DeployLocal.s.sol"
      - "contracts/script/check-verifier-ic.mjs"
      - "contracts/script/refuse-and-replay-on-anvil.mjs"
      - ".github/actions/circom/**"
      - ".github/scripts/vitest-summary.mjs"
      - ".github/workflows/circuits.yml"
  # No path filter on pull_request, deliberately. A required status check that a
  # filter skips never reports, and GitHub blocks the merge waiting for a run
  # that will not happen. The push filter above still keeps main's runs narrow.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuits:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - uses: ./.github/actions/circom

      - run: npm ci

      # 19 MB from S3 on every run otherwise. Keyed on fetch-ptau.mjs, which is
      # where the adoption record lives — filename, size and both digests — so
      # adopting a different powers of tau misses the cache instead of reusing
      # the old file. fetch-ptau.mjs re-verifies the bytes on every run either
      # way, which is what makes caching a downloaded trust anchor safe at all.
      - name: Cache the phase-1 powers of tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: circuits/build/ppot_0080_14.ptau
          key: ptau-${{ hashFiles('circuits/scripts/fetch-ptau.mjs') }}

      - name: Compile the circuits and build a development proving key
        run: npm run build

      - name: The artifacts the tests refuse to run without
        run: |
          set -uo pipefail
          missing=0
          for f in \
            build/payment_js/payment.wasm \
            build/payment.zkey \
            build/payment_vk.json \
            build/timestamp_checked_js/timestamp_checked.wasm \
            build/timestamp_unchecked_js/timestamp_unchecked.wasm
          do
            if [ -f "$f" ]; then echo "  ok      $f"
            else echo "  MISSING $f"; missing=1; fi
          done
          exit $missing

      # What the key is, printed on every run, read out of the binary rather
      # than taken from a claim in a README: a real phase 1 and a development
      # phase 2, until square#16's ceremony runs.
      - name: What the proving key's setup actually is
        run: node scripts/inspect-zkey-setup.mjs build/payment.zkey

      # square#121: the committed verifier's IC points are the only group bound
      # to the circuit, and nothing checked them against a circuit that had just
      # compiled. contracts.yml runs forge test on the committed verifier and
      # committed fixtures; this job builds the circuit. Neither looked at the
      # other's output, so an edit to payment.circom left a verifier behind for
      # a circuit that no longer exists.
      #
      # ALPHA and BETA are already pinned by the ptau fingerprint, GAMMA is a
      # constant, and DELTA cannot be reproduced while build.mjs draws fresh
      # entropy per build — see the script for why that leaves IC.
      - name: The committed verifier is keyed to this circuit
        working-directory: contracts
        run: node script/check-verifier-ic.mjs ../circuits/build/payment_vk.json

      - name: Tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/circuits.json

      - name: How many tests ran
        if: always()
        run: node ../.github/scripts/vitest-summary.mjs /tmp/circuits.json circuits

  # packages.yml already runs this service hermetically, which is the right
  # check for a contributor who has not built the circuit. It is not the whole
  # story: without a key, five real tests skip — the three that drive POST
  # /prove through a genuine Groth16 prove, and the two that check the prover's
  # Solidity calldata against `snarkjs zkey export soliditycalldata`. Those are
  # the two claims this service exists to support. This job runs them.
  proving:
    name: prover (real proving key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: ./.github/actions/circom

      # Same key as the job above, so the two share one cached download.
      - name: Cache the phase-1 powers of tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: circuits/build/ppot_0080_14.ptau
          key: ptau-${{ hashFiles('circuits/scripts/fetch-ptau.mjs') }}

      - name: Build the circuit and a development proving key
        working-directory: circuits
        run: |
          npm ci
          npm run build

      # The prover depends on @squaresdk/observability by path.
      - name: Build @squaresdk/observability
        working-directory: packages/observability
        run: |
          npm install
          npm run build

      # What services/prover/README.md tells a contributor to do by hand.
      - name: Put the artifacts where the service looks for them
        run: |
          set -euo pipefail
          mkdir -p services/prover/artifacts
          cp circuits/build/payment.zkey services/prover/artifacts/
          cp circuits/build/payment_js/payment.wasm services/prover/artifacts/
          ls -l services/prover/artifacts

      - name: The artifacts the end-to-end suites refuse to run without
        run: |
          set -uo pipefail
          missing=0
          for f in services/prover/artifacts/payment.wasm services/prover/artifacts/payment.zkey; do
            if [ -f "$f" ]; then echo "  ok      $f"
            else echo "  MISSING $f"; missing=1; fi
          done
          exit $missing

      - name: Tests, with the real circuit
        working-directory: services/prover
        env:
          NODE_ENV: test
          PROVER_ARTIFACTS_DIR: ./artifacts
        run: |
          npm install --install-links
          npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/proving.json

      - name: How many tests ran
        if: always()
        run: node .github/scripts/vitest-summary.mjs /tmp/proving.json "prover (real proving key)"

  # square#19: a policy, a proof built from it, and Arc accepting that proof.
  #
  # Separate from the two jobs above because it is the only one here that talks
  # to a network, and a testnet hiccup should read as "the end-to-end check
  # could not reach Arc", not as a circuit regression.
  #
  # It does not use test/fixtures/proofs.json. Those are proofs generated at
  # some earlier time, which answers "does a proof verify on Arc" but not "does
  # a proof built from this policy, now, carry this policy's commitment into a
  # verification the chain accepts". The script starts from the policy.
  #
  # It also builds its own verifier, from the key this run produced. That is
  # forced rather than chosen: build.mjs draws its phase-2 entropy from
  # crypto.getRandomValues, so every build yields a different `delta` and a
  # verifier that matches only that build. Pinning this to the committed
  # verifier would test a frozen artifact instead of the pipeline. The bytecode
  # is the repository's own contract; only the key is this run's.
  end-to-end:
    name: end-to-end (policy → proof → Arc)
    runs-on: ubuntu-latest
    # A job that reaches a network needs a ceiling, and this one has now used it
    # twice for two different reasons.
    #
    # First it sat for hours on a compiler download inside a scratch Foundry
    # project; that is fixed by compiling in this project instead. Then it hit
    # the ceiling every run for a reason the ceiling itself made visible: the
    # script finished in under a minute, printed its result, and never exited,
    # because snarkjs leaves a worker pool up after fullProve. At six hours that
    # read as a hang; at fifteen minutes it read as a process that had finished
    # and not left, which is what it was.
    #
    # Measured, not estimated: the job takes 55 seconds. Fifteen minutes is a
    # ceiling, not a budget — an earlier version of this comment called it
    # generous and put the work at three minutes, and both were guesses.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.9.1
        with:
          version: stable

      - uses: ./.github/actions/circom

      # ppot_0080_14, like the two jobs above. This job was written before #45
      # moved the adoption from power 13 to 14, and #136 updated the other two
      # paths and not this one, so the step was caching a file that does not
      # exist: green, and downloading 19 MB on every run. The key is the hash of
      # fetch-ptau.mjs, which is where the adoption record lives, so a future
      # move misses the cache rather than restoring the wrong file.
      - name: Cache the phase-1 powers of tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: circuits/build/ppot_0080_14.ptau
          key: ptau-${{ hashFiles('circuits/scripts/fetch-ptau.mjs') }}

      - name: Build the circuit and a development proving key
        working-directory: circuits
        run: |
          npm ci
          npm run build

      # Warms solc 0.8.28 into ~/.svm, which is shared across projects, so the
      # scratch project the script compiles in does not download a compiler
      # mid-run. `--contracts` takes a source directory, not a file, so this is
      # a plain build rather than a narrowed one.
      - name: Warm the Solidity compiler
        working-directory: contracts
        run: forge build

      - name: Put the artifacts where the prover looks for them
        run: |
          set -euo pipefail
          mkdir -p services/prover/artifacts
          cp circuits/build/payment.zkey services/prover/artifacts/
          cp circuits/build/payment_vk.json services/prover/artifacts/
          cp circuits/build/payment_js/payment.wasm services/prover/artifacts/

      - name: Install the prover
        working-directory: services/prover
        run: npm install --install-links

      - name: A policy, a proof built from it, and Arc accepting it
        working-directory: contracts
        run: |
          set -o pipefail
          node script/prove-and-verify-on-arc.mjs | tee ../end-to-end.txt

      - name: On the run summary
        if: always()
        run: |
          {
            echo '### End to end: policy → proof → Arc'
            echo
            echo '```'
            cat end-to-end.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  refuse-and-replay:
    name: refuse and replay (policy → proof → anvil)
    runs-on: ubuntu-latest
    # square#76: a non-compliant payment is refused and a spent proof cannot pay
    # twice, with the proof coming from the real prover and the release going
    # through the real kernel, keeper and hook. On anvil rather than Arc, because
    # everything it needs is something a shared testnet cannot give a CI run: a
    # hook owner key on the runner, a clock it can move past a one-day challenge
    # window, and accounts that sign without secrets. #19's job above already
    # shows the verifier against Arc's own precompiles; this one is about what
    # the chain *does* with a verdict, which is local-chain work.
    #
    # Hermetic apart from the ptau fetch the circuit build already makes, which
    # is also why this job can be promoted to a required check once it has run
    # for a while: its red is a statement about the change, not about a network.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.9.1
        with:
          version: stable

      - uses: ./.github/actions/circom

      - name: Cache the phase-1 powers of tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: circuits/build/ppot_0080_14.ptau
          key: ptau-${{ hashFiles('circuits/scripts/fetch-ptau.mjs') }}

      # npm ci installs circuits' devDependencies too, which matters here:
      # scripts/rerandomise.mjs needs @noble/curves for scenario E.
      - name: Build the circuit and a development proving key
        working-directory: circuits
        run: |
          npm ci
          npm run build

      - name: Put the artifacts where the prover looks for them
        run: |
          set -euo pipefail
          mkdir -p services/prover/artifacts
          cp circuits/build/payment.zkey services/prover/artifacts/
          cp circuits/build/payment_vk.json services/prover/artifacts/
          cp circuits/build/payment_js/payment.wasm services/prover/artifacts/

      - name: Install the prover
        working-directory: services/prover
        run: npm install --install-links

      # DeployLocal without INSTALL_COMPLIANCE_MODULE: the module it deploys is
      # bound to the committed verifier, which rejects every proof this run's
      # key produces. The script installs one bound to this build instead.
      - name: A local chain, and the stack on it
        working-directory: contracts
        run: |
          set -euo pipefail
          anvil --silent &
          for _ in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          forge script script/DeployLocal.s.sol --rpc-url http://127.0.0.1:8545 --broadcast

      - name: Refused when not compliant, and a spent proof paid once
        working-directory: contracts
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545
        run: |
          set -o pipefail
          node script/refuse-and-replay-on-anvil.mjs | tee ../refuse-and-replay.txt

      - name: On the run summary
        if: always()
        run: |
          {
            echo '### Refuse and replay: policy → proof → anvil'
            echo
            echo '```'
            cat refuse-and-replay.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
