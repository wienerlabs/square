name: ready labels

# Bir issue kapandiginda ona bagimli olanlar acilabilir hale gelir.
# Bu workflow native issue bagimliliklarini okuyup `ready` etiketini
# yeniden hesaplar.
#
# ATAMALARA DOKUNMAZ. Sahiplik kaynak projeye gore sabittir
# (covenant -> kh0ra, aperture -> MuhammedAkinci, aip -> mehmethayirli)
# ve issue bloke olsun olmasin gorunur kalir. Sira bilgisini `ready`
# etiketi ve GitHub'in native bagimlilik uyarisi tasir.

on:
  issues:
    types: [closed, reopened, opened]
  workflow_dispatch:
  # Bagimliliklar issue olusturulduktan SONRA eklenirse 'opened' tetiklemesi
  # issue'yu yanlislikla hazir sayar. Saatlik tarama bu surkulenmeyi duzeltir.
  schedule:
    - cron: "17 * * * *"

permissions:
  issues: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: recompute ready labels
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const n = issue.number;

              // native bağımlılıklar
              let blockers = [];
              try {
                const r = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  {owner, repo, issue_number: n});
                blockers = r.data;
              } catch (e) {
                core.warning(`#${n}: bağımlılık okunamadı (${e.status})`);
                continue;
              }

              const openBlockers = blockers.filter(b => b.state === 'open').map(b => b.number);
              const isReady = openBlockers.length === 0;
              const labels = issue.labels.map(l => l.name);
              const hasReady = labels.includes('ready');
              if (isReady && !hasReady) {
                await github.rest.issues.addLabels({owner, repo, issue_number: n, labels: ['ready']});
                core.notice(`#${n} hazir oldu`);
              } else if (!isReady && hasReady) {
                await github.rest.issues.removeLabel({owner, repo, issue_number: n, name: 'ready'})
                  .catch(() => {});
                core.notice(`#${n} tekrar bloke: #${openBlockers.join(', #')}`);
              }
            }
