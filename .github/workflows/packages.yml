name: packages

on:
  push:
    branches: [main]
    paths:
      - "packages/data/**"
      - "packages/hardening/**"
      - "packages/observability/**"
      - "packages/x402/**"
      - "packages/aa/**"
      - "services/indexer/**"
      - "services/keeper/**"
      - "services/prover/**"
      - "app/**"
      - "site/**"
      - "contracts/**"
      - ".github/workflows/packages.yml"
  # No path filter on pull_request, deliberately. A required status check that a
  # filter skips never reports, and GitHub blocks the merge waiting for a run
  # that will not happen. The push filter above still keeps main's runs narrow.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/data
          - packages/hardening
          - packages/observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, typecheck, test, build
        working-directory: ${{ matrix.package }}
        run: |
          npm install --install-links
          npm run typecheck
          npm test
          npm run build

  chain:
    name: ${{ matrix.package }} (anvil)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/x402
          - packages/aa
          - services/indexer
          - services/keeper
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Build path dependencies
        run: |
          for dep in packages/did-resolver packages/core packages/data packages/observability packages/hardening services/indexer; do
            if [ -f "$dep/package.json" ]; then
              (cd "$dep" && npm install --install-links && npm run build)
            fi
          done
      - name: Install, typecheck, test, build
        working-directory: ${{ matrix.package }}
        run: |
          npm install --install-links
          npm run typecheck
          npm test
          npm run build

  prover:
    name: services/prover (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build @squaresdk/observability
        working-directory: packages/observability
        run: |
          npm install
          npm run build
      - name: Install and test
        working-directory: services/prover
        env:
          NODE_ENV: test
        run: |
          npm install --install-links
          npm test

  app:
    name: app (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build path dependencies
        run: |
          for dep in packages/did-resolver packages/core; do
            (cd "$dep" && npm install --install-links && npm run build)
          done
      - name: Install, typecheck, test, build
        working-directory: app
        run: |
          npm install --install-links
          npm run typecheck
          npm test
          npm run build
      - name: Export is complete
        run: test -f app/out/index.html && test -f app/out/dashboard/index.html

  site:
    name: site (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, typecheck, build
        working-directory: site
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Export is complete
        run: test -f site/out/index.html
