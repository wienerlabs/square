name: cli

# Typecheck, unit-test and smoke-test @squaresdk/cli.
#
# Hermetic on purpose: no step contacts an RPC. The live checks against Arc
# Testnet are opt-in (LIVE=1) and the acceptance test needs a funded key, so
# neither belongs in a run that has to pass on every pull request.

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/did-resolver/**"
      - "docs/smoke/**"
      - "docs/agent-card/schema.json"
      - ".github/scripts/vitest-summary.mjs"
      - ".github/workflows/cli.yml"
  # No path filter on pull_request, deliberately. A required status check that a
  # filter skips never reports, and GitHub blocks the merge waiting for a run
  # that will not happen. The push filter above still keeps main's runs narrow.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The CLI depends on the resolver by path, so the resolver has to be built
      # before the CLI can typecheck against its declarations.
      - name: Build @squaresdk/did-resolver
        working-directory: packages/did-resolver
        run: |
          npm install
          npm run build
          npm test

      - name: Install @squaresdk/cli
        working-directory: packages/cli
        # --install-links copies the path dependency instead of symlinking it;
        # a symlink here resolves outside the package and breaks the build.
        run: npm install --install-links

      - name: Typecheck
        working-directory: packages/cli
        run: npm run typecheck

      - name: Unit tests
        working-directory: packages/cli
        run: npm test

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Smoke test (hermetic — no RPC is contacted)
        working-directory: packages/cli
        env:
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          # A fresh HOME, so nothing here can read or write a real keystore.
          export SQUARE_HOME="$(mktemp -d)"

          fail=0
          check() {  # name expected-exit-code args...
            local name="$1" expected="$2"; shift 2
            # Actions runs steps under `bash -e`, and most of these commands are
            # supposed to fail. Assigning through `|| code=$?` keeps the call in
            # a condition context, so a non-zero exit is data here rather than
            # the end of the step.
            local code=0
            node dist/index.js "$@" >/dev/null 2>&1 || code=$?
            if [ "$code" = "$expected" ]; then echo "  ok   $name -> $code"
            else echo "  FAIL $name -> $code (expected $expected)"; fail=1; fi
          }

          check help 0 --help
          check version 0 --version
          check whoami 0 whoami --json
          # The exit codes are the CLI's contract with a shell script, so each
          # kind of failure has to stay distinguishable without parsing English.
          check invalidDid 65 resolve did:aip:invalid
          check v1Did 1 resolve did:aip:7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU:scribe
          check unknownChain 78 resolve did:aip:eip155:1:0x8004a818bfb912233c491871b3d84c89a494bd9e:1
          check noWallet 65 register --dry-run

          exit $fail

  # Phase 1's end-to-end proof, against the agents permanently registered on Arc
  # Testnet. Read-only: no key, no gas, so it can run on every pull request.
  #
  # A separate job on purpose. It is the one thing here that talks to a network,
  # and a testnet hiccup should read as "smoke failed", not as a unit-test
  # regression.
  smoke:
    name: end-to-end (Arc Testnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build @squaresdk/did-resolver
        working-directory: packages/did-resolver
        run: |
          npm install
          npm run build

      - name: Build @squaresdk/cli
        working-directory: packages/cli
        run: |
          npm install --install-links
          npm run build

      - name: Resolve the permanent smoke agents
        working-directory: packages/cli
        run: npm run test:smoke

  # The one job in this repository that can spend money, and the only one that
  # needs a secret.
  #
  # `npm run test:live` is two suites behind one flag. LIVE=1 alone runs reads
  # and an eth_call dry run against Arc: free, no key. LIVE=1 with
  # SQUARE_PRIVATE_KEY additionally registers a real agent, which costs real
  # testnet gas — that is #43's "tests needing a secret" and it cannot run
  # without a funded Arc address.
  #
  # A pull_request from a fork gets a read-only token and no secrets, so the
  # funded half could never run there; the job is skipped outright rather than
  # half-running and reporting a red check a contributor cannot act on. With the
  # secret absent on a same-repository run the reads still execute and the
  # registration suite skips itself — the summary step names it, so "we have an
  # acceptance test" and "the acceptance test ran" stay distinguishable.
  live:
    name: acceptance (Arc Testnet, funded key)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build @squaresdk/did-resolver
        working-directory: packages/did-resolver
        run: |
          npm install
          npm run build

      # test:live drives dist/index.js, not the library: the criterion is about
      # the command, so the command is what gets exercised.
      - name: Build @squaresdk/cli
        working-directory: packages/cli
        run: |
          npm install --install-links
          npm run build

      - name: Reads, dry run, and — with a funded key — a real registration
        working-directory: packages/cli
        env:
          SQUARE_PRIVATE_KEY: ${{ secrets.SQUARE_PRIVATE_KEY }}
          NO_COLOR: "1"
        run: npm run test:live -- --reporter=default --reporter=json --outputFile.json=/tmp/live.json

      - name: What ran against the chain
        if: always()
        run: node .github/scripts/vitest-summary.mjs /tmp/live.json "cli — Arc Testnet"
