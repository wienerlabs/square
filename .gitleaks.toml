# gitleaks yapilandirmasi.
#
# Varsayilan kural seti oldugu gibi kullaniliyor. Istisnalar DOSYA BAZINDA ve
# tek tek yaziliyor; "test dosyalarini atla" bicimindeki genis bir kural
# bilerek yok, cunku gercek bir sir de bir test dosyasinda durabilir.
#
# Not: bu surumde [allowlist] altindaki `regexes` alani `useDefault = true`
# ile birlestiginde uygulanmiyor; deger bazinda istisna yerine yol bazinda
# istisna yazmak zorunda kaldik. Yeni bir yol eklerken gerekcesini de yaz.

[extend]
useDefault = true

[[allowlists]]
description = """Redaksiyon testi, redakte edilmis ciktilari dogruladigi icin
yer tutucu 'REDACTED' degerleri barindiriyor; generic-api-key kurali bunlarin
entropisine takiliyor. Dosyada gercek bir kimlik bilgisi yok."""
paths = ['''^services/prover/test/error-redaction\.test\.js$''']

[[allowlists]]
description = """Anvil'in herkese acik gelistirme mnemonic'inden turetilen anahtarlar.
Bu iki dosya branch gecmisinde o anahtarlari literal olarak tasidi; simdi
mnemonic'ten turetiliyor. Anahtarlar Foundry belgelerinde yayinlanmistir ve
hicbir gercek ag uzerinde deger tutmaz (Arc USDC bu adresleri bloklamistir)."""
paths = [
  '''^contracts/script/DeployLocal\.s\.sol$''',
  '''^packages/core/test/fork\.test\.ts$''',
]

[[allowlists]]
description = """proofs.json'daki `zkey_sha256`: fixture'lari ureten zkey'in
ozeti. square#121 onu oraya koydu, cunku commit'lenmis verifier ile
fixture'larin ayni anahtardan geldigi baska turlu soylenemiyor. generic-api-key
kuralina takiliyor: 64 karakterlik hex, ve anahtar adi `_sha256` ile bitiyor.

Yol degil deger bazinda: dosyanin tamami muaf tutulsa oraya konacak gercek bir
sir de gorunmez olurdu, ve bu dosya her devre degisikliginde yeniden uretiliyor.

Degeri degistirerek cozulemez, ki ptau onbellek anahtarinda oyle cozulmustu:
orada anahtarin bicimi tesadufiydi, burada degerin kendisi kayit."""
regexTarget = "line"
regexes = ['''"zkey_sha256":\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = """Anvil'in yayinlanmis 0 numarali test hesabinin ozel anahtari.
Yerel yigin (compose.yaml) keeper'i bu anahtarla imzalar; anahtar Foundry
belgelerinde ve anvil'in her acilis ciktisinda yazilidir, 31337 disinda hicbir
seyi kontrol etmez. Istisna YOL degil DEGER bazinda: .env.example'a baska bir
anahtar girilirse gitleaks onu yine yakalar."""
regexTarget = "line"
regexes = ['''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''']
