[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The verifier is generated by snarkjs and checked in verbatim, so it is not
# formatted or linted with the rest of the tree — see src/Groth16Verifier.sol.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
