[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
invariant = { runs = 48, depth = 24, fail_on_revert = true }
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.ci]
fuzz = { runs = 512 }
# This ran nothing when #43 first looked: there was no invariant_ function under
# test/. square#26 supplies the first two, on PolicyRegistry, so it is live again:
# 128 runs of 32 calls each.
invariant = { runs = 128, depth = 32 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable", "incorrect-shift", "screaming-snake-case-immutable", "asm-keccak256"]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
